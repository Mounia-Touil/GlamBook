<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Appointment - GlamBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #fff0f6;
      color: #390328;
      padding: 40px;
    }

    .booking-box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .booking-box h2 {
      font-weight: 700;
      color: #b3002d;
      margin-bottom: 30px;
      text-align: center;
    }

    .form-label {
      font-weight: 500;
    }

    .btn-pink {
      background-color: #e189a6;
      color: white;
      border: none;
    }

    .btn-pink:hover {
      background-color: #df6f9c;
    }
  </style>
</head>
<body>

  <div class="booking-box">
    <h2>Book <span id="serviceTitle">Your Service</span></h2>
    <form id="bookingForm">
      <div class="mb-3">
        <label for="date" class="form-label">Choose Date</label>
        <input type="date" class="form-control" id="date" required />
      </div>

      <div class="mb-3">
        <label for="time" class="form-label">Choose Time</label>
        <input type="time" class="form-control" id="time" required />
      </div>

      <div class="mb-3">
        <label for="salon" class="form-label">Choose Salon</label>
        <select class="form-select" id="salon">
          <option>Glam & Go Salon</option>
          <option>Style Studio</option>
          <option>Chic Beauty Lounge</option>
        </select>
      </div>

      <button type="submit" class="btn btn-pink w-100">Confirm Appointment</button>
    </form>
  </div>

  <script>
    // Get the service type from query parameter (e.g., ?service=Hair)
    const params = new URLSearchParams(window.location.search);
    const service = params.get("service") || "Your Service";
    document.getElementById("serviceTitle").textContent = service;

    document.getElementById("bookingForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const salon = document.getElementById("salon").value;

      alert(`Booked ${service} at ${salon} on ${date} at ${time}!`);
      window.location.href = "home.html";
    });
  </script>

</body>
</html>
